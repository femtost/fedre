# limit_req_zone $binary_remote_addr zone=register:16m rate=1r/h;
limit_req_zone $binary_remote_addr zone=register:16m rate=1r/s;

server {
    listen 80;
    listen [::]:80;

    server_name s1.femtost.com;

    return 302 https://s1.femtost.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name s1.femtost.com;

    ssl_certificate     /etc/letsencrypt/live/s1.femtost.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s1.femtost.com/privkey.pem;

    # HTTPS
    location = /api/register {
        limit_req zone=register burst=2 nodelay;    
        proxy_pass http://localhost:4000;       
         
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
                
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
    location / {
        proxy_pass http://localhost:4000;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # WebSocket
    location = /connect {
        proxy_pass http://localhost:4000;       

        # 1. Force HTTP/1.1 and forward protocol upgrade headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 2. Increase inactivity timeouts (e.g., to 24 hours)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # 3. Standard headers to preserve client details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}